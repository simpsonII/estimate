<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimal Design Quote & Invoice Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Pretendard -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HTML2Canvas & jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --font-sans: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            --apple-bg: #F5F5F7;
            --apple-card: #FFFFFF;
            --apple-text: #1D1D1F;
            --apple-sub: #86868B;
            --apple-border: #E5E5EA;
            --apple-spring: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-sans);
            background-color: var(--apple-bg);
            color: var(--apple-text);
            letter-spacing: -0.015em;
        }

        /* 상하 스크롤 시 좌우 흔들림 완벽 차단 */
        .scroll-lock-x {
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
        }

        /* Apple 스타일 카드 */
        .apple-card {
            background: var(--apple-card);
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
            transition: box-shadow 0.25s ease;
        }
        .apple-card:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        /* 입력 필드 (부모 영역 밖으로 절대 튀어나가지 않도록 고정) */
        .apple-input {
            display: block;
            width: 100%;
            min-width: 0;
            max-width: 100%;
            background-color: #F5F5F7;
            border: 1.5px solid transparent;
            border-radius: 11px;
            padding: 9px 12px;
            font-size: 13.5px;
            font-weight: 500;
            color: #1D1D1F;
            transition: all 0.18s ease;
        }
        .apple-input::placeholder {
            color: #A1A1A6;
            font-weight: 400;
        }
        .apple-input:hover {
            background-color: #EBEBED;
        }
        .apple-input:focus {
            outline: none;
            background-color: #FFFFFF;
            border-color: #1D1D1F;
            box-shadow: 0 0 0 3px rgba(29, 29, 31, 0.06);
        }

        /* 버튼 마이크로 인터랙션 */
        .apple-btn {
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s var(--apple-spring);
        }
        .apple-btn:active {
            transform: scale(0.96);
        }

        /* 상단 세그먼트 버튼 */
        .seg-pill {
            background: rgba(118, 118, 128, 0.12);
            padding: 3px;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .seg-btn {
            border-radius: 7px;
            padding: 5px 12px;
            font-size: 12.5px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s var(--apple-spring);
        }
        .seg-btn.active {
            background: #FFFFFF;
            color: #1D1D1F;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        }
        .seg-btn.inactive {
            color: #6E6E73;
        }
        .seg-btn.inactive:hover {
            color: #1D1D1F;
        }

        /* 한국어 및 영문 혼용 어절 단위 줄바꿈 */
        .organic-text {
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        /* 금액 및 수량 숫자 줄바꿈 방지 */
        .organic-num {
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        /* 종이 위 클릭 가이드 */
        .preview-clickable {
            border-radius: 6px;
            transition: background-color 0.15s ease;
            cursor: pointer;
        }
        .preview-clickable:hover {
            background-color: rgba(0, 0, 0, 0.035);
        }

        /* A4 표준 규격 캔버스 (210mm : 297mm = 740px : 1046px 엄격 고정) */
        .paper-canvas {
            position: relative;
            width: 740px;
            height: 1046px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
            flex-shrink: 0;
            overflow: hidden;
        }

        /* 모바일 iOS 자동 확대 방지 */
        @media (max-width: 640px) {
            .apple-input {
                font-size: 16px;
                padding: 9px 11px;
            }
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.18);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.32);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none">

    <!-- 1. 상단 네비게이션 헤더 -->
    <header class="h-14 sm:h-16 bg-white/95 backdrop-blur-xl border-b border-black/[0.08] px-3 sm:px-6 flex items-center justify-between gap-2 shrink-0 z-30 w-full">
        <!-- 좌측: 로고 & 한/영 템플릿 전환 -->
        <div class="flex items-center gap-2.5 sm:gap-4 min-w-0">
            <div class="flex items-center gap-2 shrink-0">
                <span class="w-8 h-8 rounded-[9px] bg-[#1D1D1F] text-white font-black text-base flex items-center justify-center tracking-tighter shadow-sm">h.</span>
                <span class="font-bold text-[15px] tracking-tight text-[#1D1D1F] hidden sm:inline">Quote Studio</span>
            </div>

            <div class="h-4 w-[1px] bg-black/10 hidden sm:block shrink-0"></div>

            <div class="seg-pill flex items-center">
                <button type="button" onclick="applyPreset('kr')" id="preset-kr-btn" class="seg-btn active">
                    한국어 양식
                </button>
                <button type="button" onclick="applyPreset('en')" id="preset-en-btn" class="seg-btn inactive">
                    EN 원본
                </button>
            </div>
        </div>

        <!-- 중앙: 화면 분할 모드 전환 (데스크톱/태블릿) -->
        <div class="seg-pill hidden md:flex items-center">
            <button type="button" onclick="setViewMode('split')" id="view-split-btn" class="seg-btn active flex items-center gap-1.5">
                <i data-lucide="columns" class="w-3.5 h-3.5"></i>
                <span>입력 + 미리보기</span>
            </button>
            <button type="button" onclick="setViewMode('edit')" id="view-edit-btn" class="seg-btn inactive flex items-center gap-1.5">
                <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                <span>입력 전용</span>
            </button>
            <button type="button" onclick="setViewMode('preview')" id="view-preview-btn" class="seg-btn inactive flex items-center gap-1.5">
                <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
                <span>미리보기 전용</span>
            </button>
        </div>

        <!-- 우측: JPG / PDF 저장 버튼 -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
            <button type="button" onclick="exportDocument('jpg')" class="apple-btn flex items-center gap-1.5 px-3 sm:px-4 py-1.5 sm:py-2 rounded-full bg-[#F5F5F7] hover:bg-[#E5E5EA] text-[#1D1D1F] text-[12px] sm:text-[13px] font-semibold border border-black/[0.08]">
                <i data-lucide="image" class="w-3.5 h-3.5"></i>
                <span>JPG 저장</span>
            </button>
            <button type="button" onclick="exportDocument('pdf')" class="apple-btn flex items-center gap-1.5 px-3.5 sm:px-5 py-1.5 sm:py-2 rounded-full bg-[#1D1D1F] hover:bg-[#323236] text-white text-[12px] sm:text-[13px] font-semibold shadow-sm">
                <i data-lucide="arrow-down-to-line" class="w-3.5 h-3.5"></i>
                <span>PDF 저장</span>
            </button>
        </div>
    </header>

    <!-- 2. 메인 워크스페이스 (좌측 입력 패널 + 우측 미리보기 패널) -->
    <main class="flex-1 flex w-full h-full overflow-hidden relative">
        
        <!-- [좌측] 입력 에디터 패널 -->
        <aside id="editor-panel" class="w-full md:w-[440px] lg:w-[500px] xl:w-[540px] bg-[#F5F5F7] border-r border-black/[0.08] flex flex-col h-full scroll-lock-x shrink-0 z-20">
            <div class="p-4 sm:p-5 pb-28 md:pb-12 space-y-4 max-w-xl mx-auto w-full">

                <!-- 섹션 1: 타이틀 & 스튜디오 기본 정보 -->
                <section class="apple-card p-4 sm:p-5 space-y-4">
                    <div class="flex items-center justify-between gap-2">
                        <div>
                            <h2 class="text-[15px] sm:text-[16px] font-bold text-[#1D1D1F]">1. 타이틀 & 회사 정보</h2>
                            <p class="text-[11.5px] text-[#86868B]">상단 헤드라인과 스튜디오 정보를 설정합니다.</p>
                        </div>
                        <select id="inp-currency" class="bg-[#F5F5F7] hover:bg-[#EBEBED] border border-black/[0.08] text-[12px] font-bold text-[#1D1D1F] rounded-lg px-2.5 py-1.5 focus:outline-none cursor-pointer shrink-0">
                            <option value="KRW">₩ KRW (원)</option>
                            <option value="USD">$ USD (달러)</option>
                            <option value="EUR">€ EUR (유로)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11.5px] font-semibold text-[#6E6E73] mb-1">메인 헤드라인</label>
                            <input type="text" id="inp-greeting" class="apple-input font-extrabold" placeholder="hello.">
                        </div>
                        <div>
                            <label class="block text-[11.5px] font-semibold text-[#6E6E73] mb-1">디자인 회사명</label>
                            <input type="text" id="inp-company" class="apple-input font-semibold" placeholder="STUDIO MONOLITH">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11.5px] font-semibold text-[#6E6E73] mb-1">서브 타이틀</label>
                        <input type="text" id="inp-subtitle" class="apple-input" placeholder="THIS IS YOUR DESIGN QUOTATION">
                    </div>

                    <!-- 컬러 커스텀 -->
                    <div class="pt-3 border-t border-black/[0.06]">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[11.5px] font-semibold text-[#6E6E73]">종이 & 서체 컬러 테마</span>
                            <button type="button" onclick="resetColors()" class="text-[11px] font-semibold text-[#86868B] hover:text-[#1D1D1F] underline">기본값 복원</button>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <label class="flex items-center gap-2 bg-[#F5F5F7] hover:bg-[#EBEBED] p-2 rounded-xl cursor-pointer">
                                <input type="color" id="inp-color-paper" value="#f6f6f4" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent shrink-0">
                                <div class="min-w-0">
                                    <div class="text-[11px] font-bold text-[#1D1D1F] truncate">종이색</div>
                                    <div id="txt-color-paper" class="text-[9.5px] font-mono text-[#86868B] uppercase">#f6f6f4</div>
                                </div>
                            </label>
                            <label class="flex items-center gap-2 bg-[#F5F5F7] hover:bg-[#EBEBED] p-2 rounded-xl cursor-pointer">
                                <input type="color" id="inp-color-text" value="#141414" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent shrink-0">
                                <div class="min-w-0">
                                    <div class="text-[11px] font-bold text-[#1D1D1F] truncate">본문색</div>
                                    <div id="txt-color-text" class="text-[9.5px] font-mono text-[#86868B] uppercase">#141414</div>
                                </div>
                            </label>
                            <label class="flex items-center gap-2 bg-[#F5F5F7] hover:bg-[#EBEBED] p-2 rounded-xl cursor-pointer">
                                <input type="color" id="inp-color-accent" value="#181818" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent shrink-0">
                                <div class="min-w-0">
                                    <div class="text-[11px] font-bold text-[#1D1D1F] truncate">강조색</div>
                                    <div id="txt-color-accent" class="text-[9.5px] font-mono text-[#86868B] uppercase">#181818</div>
                                </div>
                            </label>
                            <label class="flex items-center gap-2 bg-[#F5F5F7] hover:bg-[#EBEBED] p-2 rounded-xl cursor-pointer">
                                <input type="color" id="inp-color-border" value="#181818" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent shrink-0">
                                <div class="min-w-0">
                                    <div class="text-[11px] font-bold text-[#1D1D1F] truncate">선 색상</div>
                                    <div id="txt-color-border" class="text-[9.5px] font-mono text-[#86868B] uppercase">#181818</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- 우측 상단 메타 정보 -->
                    <div class="pt-3 border-t border-black/[0.06] space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[11.5px] font-semibold text-[#6E6E73]">문서 번호 및 조건 항목</span>
                            <button type="button" onclick="addMetaField()" class="apple-btn text-[11.5px] font-semibold text-[#1D1D1F] bg-[#F5F5F7] hover:bg-[#E5E5EA] px-2.5 py-1 rounded-lg flex items-center gap-1">
                                <i data-lucide="plus" class="w-3 h-3"></i> 추가
                            </button>
                        </div>
                        <div id="meta-fields-container" class="space-y-2"></div>
                    </div>
                </section>

                <!-- 섹션 2: 수신자 & 프로젝트 정보 -->
                <section class="apple-card p-4 sm:p-5 space-y-3.5">
                    <div>
                        <h2 class="text-[15px] sm:text-[16px] font-bold text-[#1D1D1F]">2. 수신자 & 프로젝트 개요</h2>
                        <p class="text-[11.5px] text-[#86868B]">클라이언트와 프로젝트 정보를 입력합니다.</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="space-y-2">
                            <input type="text" id="inp-bill-title" class="apple-input font-bold text-[12.5px]" placeholder="CLIENT (수신)">
                            <textarea id="inp-bill-lines" rows="4" class="apple-input text-[12.5px] leading-relaxed resize-none"></textarea>
                        </div>
                        <div class="space-y-2">
                            <input type="text" id="inp-ship-title" class="apple-input font-bold text-[12.5px]" placeholder="PROJECT (과업 개요)">
                            <textarea id="inp-ship-lines" rows="4" class="apple-input text-[12.5px] leading-relaxed resize-none"></textarea>
                        </div>
                    </div>
                </section>

                <!-- 섹션 3: 계층형 견적 품목 -->
                <section class="apple-card p-4 sm:p-5 space-y-3.5">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <div>
                            <h2 class="text-[15px] sm:text-[16px] font-bold text-[#1D1D1F]">3. 견적 품목 (계층 구조 지원)</h2>
                            <p class="text-[11.5px] text-[#86868B]">A4 한 장 초과 시 자동으로 다음 페이지가 생성됩니다.</p>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button type="button" onclick="addCategoryHeader()" class="apple-btn px-3 py-1.5 rounded-lg bg-[#F5F5F7] hover:bg-[#E5E5EA] text-[#1D1D1F] font-semibold text-[11.5px] flex items-center gap-1 border border-black/[0.06]">
                                <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i> 대분류 추가
                            </button>
                            <button type="button" onclick="addQuoteItem()" class="apple-btn px-3 py-1.5 rounded-lg bg-[#1D1D1F] hover:bg-[#323236] text-white font-semibold text-[11.5px] flex items-center gap-1">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> 품목 추가
                            </button>
                        </div>
                    </div>

                    <div id="items-editor-list" class="space-y-3"></div>
                </section>

                <!-- 섹션 4: 부가세(퍼센트 자동계산) / 노트 / 하단 푸터 -->
                <section class="apple-card p-4 sm:p-5 space-y-3.5">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-[15px] sm:text-[16px] font-bold text-[#1D1D1F]">4. 세금/할인(% 자동계산) 및 푸터</h2>
                            <p class="text-[11.5px] text-[#86868B]">값에 '10%'처럼 입력하면 서브토털 기준 자동계산됩니다.</p>
                        </div>
                        <button type="button" onclick="addSummaryRow()" class="apple-btn text-[11.5px] font-semibold text-[#1D1D1F] bg-[#F5F5F7] hover:bg-[#E5E5EA] px-2.5 py-1 rounded-lg flex items-center gap-1">
                            <i data-lucide="plus" class="w-3 h-3"></i> 합계항목 추가
                        </button>
                    </div>

                    <div id="extra-summary-container" class="space-y-2"></div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-2 border-t border-black/[0.06]">
                        <div>
                            <label class="block text-[11.5px] font-semibold text-[#6E6E73] mb-1">노트 타이틀</label>
                            <input type="text" id="inp-notes-title" class="apple-input font-semibold" placeholder="NOTES">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-[11.5px] font-semibold text-[#6E6E73] mb-1">웹사이트 주소</label>
                            <input type="text" id="inp-website" class="apple-input" placeholder="www.studiomonolith.kr">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11.5px] font-semibold text-[#6E6E73] mb-1">결제 계좌 및 유의사항</label>
                        <textarea id="inp-notes-content" rows="3" class="apple-input text-[12.5px] leading-relaxed resize-none"></textarea>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-black/[0.06]">
                        <div>
                            <label class="block text-[11.5px] font-semibold text-[#6E6E73] mb-1">하단 회사 주소/연락처</label>
                            <textarea id="inp-footer-address" rows="3" class="apple-input text-[12.5px] leading-relaxed resize-none"></textarea>
                        </div>
                        <div class="flex flex-col justify-between">
                            <div>
                                <label class="block text-[11.5px] font-semibold text-[#6E6E73] mb-1">하단 슬로건</label>
                                <textarea id="inp-footer-ThankYou" rows="2" class="apple-input text-[12.5px] font-bold resize-none"></textarea>
                            </div>
                            <label class="flex items-center gap-2 text-[12.5px] font-medium text-[#1D1D1F] cursor-pointer pt-2">
                                <input type="checkbox" id="inp-show-socials" class="w-4 h-4 rounded border-zinc-300 text-[#1D1D1F]">
                                <span>하단 소셜 아이콘 표시</span>
                            </label>
                        </div>
                    </div>
                </section>

            </div>
        </aside>

        <!-- [우측] 실시간 A4 프리뷰 패널 (확대/축소 시 상하좌우 스크롤 완벽 작동) -->
        <section id="preview-panel" class="hidden md:flex flex-1 h-full bg-[#E5E5EA] flex-col overflow-hidden relative" style="background: radial-gradient(circle at 50% 20%, #EFEFF4 0%, #D1D1D6 100%);">

        let state = JSON.parse(JSON.stringify(PRESET_KR));
        let currentZoom = 1;
        let currentViewMode = 'split';

        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function formatMoney(amount) {
            const num = Number(amount) || 0;
            if (state.currency === 'KRW') {
                return '₩' + Math.round(num).toLocaleString('ko-KR');
            }
            const sym = state.currency === 'EUR' ? '€' : '$';
            return sym + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // 퍼센트 계산 파서 (예: "10%" -> 서브토털의 10%, "700000" 또는 빈칸 -> 고정 금액)
        function calculateSummaryAmount(valStr, subtotal) {
            const str = (valStr + '').trim();
            if (str.endsWith('%')) {
                const percent = parseFloat(str) || 0;
                return Math.round(subtotal * (percent / 100));
            }
            return Number(str) || 0;
        }

        // 화면 보기 모드 전환
        function setViewMode(mode) {
            currentViewMode = mode;
            const editor = document.getElementById('editor-panel');
            const preview = document.getElementById('preview-panel');
            const btnSplit = document.getElementById('view-split-btn');
            const btnEdit = document.getElementById('view-edit-btn');
            const btnPreview = document.getElementById('view-preview-btn');
            const mobEdit = document.getElementById('mob-edit-btn');
            const mobPreview = document.getElementById('mob-preview-btn');

            [btnSplit, btnEdit, btnPreview].forEach(b => {
                if (!b) return;
                b.classList.remove('active');
                b.classList.add('inactive');
            });

            if (mode === 'split') {
                editor.className = "w-full md:w-[440px] lg:w-[500px] xl:w-[540px] bg-[#F5F5F7] border-r border-black/[0.08] flex flex-col h-full scroll-lock-x shrink-0 z-20";
                preview.className = "hidden md:flex flex-1 h-full bg-[#E5E5EA] flex-col overflow-hidden relative";
                if (btnSplit) btnSplit.classList.replace('inactive', 'active');
                setTimeout(fitPaperToScreen, 40);
            } else if (mode === 'edit') {
                editor.className = "w-full bg-[#F5F5F7] flex flex-col h-full scroll-lock-x shrink-0 z-20";
                preview.className = "hidden";
                if (btnEdit) btnEdit.classList.replace('inactive', 'active');
                if (mobEdit && mobPreview) {
                    mobEdit.className = "apple-btn px-5 py-2 rounded-full text-[13px] font-bold flex items-center gap-1.5 bg-white text-[#1D1D1F] shadow-sm";
                    mobPreview.className = "apple-btn px-5 py-2 rounded-full text-[13px] font-bold flex items-center gap-1.5 text-white/80 hover:text-white";
                }
            } else if (mode === 'preview') {
                editor.className = "hidden";
                preview.className = "w-full flex-1 h-full bg-[#E5E5EA] flex flex-col overflow-hidden relative";
                if (btnPreview) btnPreview.classList.replace('inactive', 'active');
                if (mobEdit && mobPreview) {
                    mobPreview.className = "apple-btn px-5 py-2 rounded-full text-[13px] font-bold flex items-center gap-1.5 bg-white text-[#1D1D1F] shadow-sm";

                setTimeout(fitPaperToScreen, 40);

        // 미리보기 클릭 시 입력칸 포커스 이동
        function focusInput(inputId) {
            const editor = document.getElementById('editor-panel');
            if (editor.classList.contains('hidden')) {
                setViewMode(window.innerWidth >= 768 ? 'split' : 'edit');
            }
            const el = document.getElementById(inputId);
            if (el) {
                setTimeout(() => {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.focus();
                }, 180);
            }
        }

        // 확대/축소 및 스크롤 영역 동기화
        function adjustZoom(delta) {
            currentZoom = Math.min(1.6, Math.max(0.35, +(currentZoom + delta).toFixed(2)));
            applyZoom();
        }
        function resetZoom() {
            currentZoom = 1;
            applyZoom();
        }
        function fitPaperToScreen() {
            const viewport = document.getElementById('preview-scroll-viewport');
            if (!viewport || viewport.offsetParent === null) return;
            const availableWidth = viewport.clientWidth - (window.innerWidth < 640 ? 28 : 64);
            const paperBaseWidth = 740;
            if (availableWidth < paperBaseWidth) {
                currentZoom = Math.max(0.38, +(availableWidth / paperBaseWidth).toFixed(2));
            } else {
                currentZoom = 1;
            }
            applyZoom();
        }
        function applyZoom() {
            const wrapper = document.getElementById('paper-zoom-wrapper');
            const sizer = document.getElementById('paper-scroll-sizer');
            const host = document.getElementById('pages-host');
            if (!wrapper || !sizer || !host) return;

            wrapper.style.transform = `scale(${currentZoom})`;
            document.getElementById('zoom-label').textContent = `${Math.round(currentZoom * 100)}%`;

            const rawHeight = host.offsetHeight || 1046;
            const scaledHeight = Math.ceil(rawHeight * currentZoom);
            const scaledWidth = Math.ceil(740 * currentZoom);

            sizer.style.height = `${scaledHeight + 40}px`;
            sizer.style.width = `${Math.max(scaledWidth, 300)}px`;
        }

        // 양식 프리셋 적용

            const enBtn = document.getElementById('preset-en-btn');

            if (type === 'kr') {
                krBtn.classList.replace('inactive', 'active');
                enBtn.classList.replace('active', 'inactive');
            } else {
                enBtn.classList.replace('inactive', 'active');
                krBtn.classList.replace('active', 'inactive');

            syncInputsFromState();
            renderPreview();
            showToast(type === 'kr' ? '한국어 디자인 견적서 양식이 적용되었습니다.' : '영문 레퍼런스 원본 양식이 적용되었습니다.');

                            <input type="text" value="${escapeHtml(sub.title)}" oninput="updateSubItem(${idx}, ${sIdx}, 'title', this.value)" class="apple-input !bg-white !py-1.5 !px-2.5 text-[12px]" placeholder="세부 품목명">
                        </div>
                        <div class="col-span-4 sm:col-span-2">
                            <input type="text" value="${escapeHtml(sub.qty || '')}" oninput="updateSubItem(${idx}, ${sIdx}, 'qty', this.value)" class="apple-input !bg-white !py-1.5 !px-2 text-center text-[11.5px]" placeholder="수량/규격">
                        </div>
                        <div class="col-span-6 sm:col-span-3">
                            <input type="number" value="${sub.price || ''}" oninput="updateSubItem(${idx}, ${sIdx}, 'price', this.value)" class="apple-input !bg-white !py-1.5 !px-2 text-right text-[11.5px] font-mono" placeholder="세부단가">
                        </div>
                        <div class="col-span-2 sm:col-span-1 flex justify-end">
                            <button type="button" onclick="removeSubItem(${idx}, ${sIdx})" class="p-1 text-[#86868B] hover:text-red-500">
                                <i data-lucide="x" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="bg-[#F5F5F7] rounded-2xl p-3.5 space-y-3 border border-black/[0.06]">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div class="flex flex-wrap items-center gap-1.5">
                                <span class="w-5 h-5 rounded-full bg-[#1D1D1F] text-white text-[10.5px] font-bold flex items-center justify-center">${idx + 1}</span>
                                <select onchange="updateItem(${idx}, 'graphic', this.value)" class="bg-white border border-black/[0.08] rounded-lg px-2 py-1 text-[11.5px] font-semibold text-[#1D1D1F] focus:outline-none">
                                    ${graphicOptions}
                                </select>
                                <label class="apple-btn cursor-pointer bg-white border border-black/[0.08] hover:bg-zinc-50 px-2 py-1 rounded-lg text-[11px] font-semibold text-[#1D1D1F] flex items-center gap-1">
                                    <i data-lucide="upload" class="w-3 h-3"></i>
                                    <span>이미지</span>
                                    <input type="file" accept="image/*" class="hidden" onchange="uploadItemImage(${idx}, this)">
                                </label>
                                ${item.customImage ? `<button type="button" onclick="clearItemImage(${idx})" class="text-[11px] text-red-500 underline">제거</button>` : ''}
                            </div>
                            <div class="flex items-center">
                                <button type="button" onclick="moveItem(${idx}, -1)" class="p-1 text-[#86868B] hover:text-[#1D1D1F]"><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
                                <button type="button" onclick="moveItem(${idx}, 1)" class="p-1 text-[#86868B] hover:text-[#1D1D1F]"><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
                                <button type="button" onclick="removeQuoteItem(${idx})" class="p-1 text-[#86868B] hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <input type="text" value="${escapeHtml(item.title)}" oninput="updateItem(${idx}, 'title', this.value)" class="apple-input !bg-white font-bold text-[13.5px]" placeholder="품목명 입력">
                            <input type="text" value="${escapeHtml(item.code)}" oninput="updateItem(${idx}, 'code', this.value)" class="apple-input !bg-white text-[12px] text-[#6E6E73]" placeholder="세부 설명 입력">
                        </div>

                        <div class="grid grid-cols-12 gap-2">
                            <div class="col-span-3">
                                <label class="block text-[10.5px] font-semibold text-[#86868B] mb-1">수량</label>
                                <input type="number" value="${item.qty}" oninput="updateItem(${idx}, 'qty', this.value)" class="apple-input !bg-white text-center font-semibold">
                            </div>
                            <div class="col-span-4">
                                <label class="block text-[10.5px] font-semibold text-[#86868B] mb-1">정가(할인전)</label>
                                <input type="number" value="${item.originalPrice || ''}" oninput="updateItem(${idx}, 'originalPrice', this.value)" class="apple-input !bg-white text-right font-mono text-[12px]" placeholder="0">
                            </div>
                            <div class="col-span-5">
                                <label class="block text-[10.5px] font-semibold text-[#1D1D1F] mb-1">공급 단가</label>
                                <input type="number" value="${item.price}" oninput="updateItem(${idx}, 'price', this.value)" class="apple-input !bg-white text-right font-mono font-bold text-[13px]">
                            </div>
                        </div>

                        <div class="pt-2 border-t border-black/[0.06] space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="text-[11.5px] font-bold text-[#6E6E73] flex items-center gap-1">
                                    <i data-lucide="corner-down-right" class="w-3.5 h-3.5"></i>
                                    <span>세부 하위 품목 (${subItems.length})</span>
                                </span>
                                <div class="flex items-center gap-1.5">
                                    ${subItems.length > 0 ? `<button type="button" onclick="sumSubItemsToParent(${idx})" class="text-[11px] font-semibold text-[#1D1D1F] bg-black/[0.06] hover:bg-black/[0.12] px-2 py-1 rounded-md">단가 합산</button>` : ''}
                                    <button type="button" onclick="addSubItem(${idx})" class="apple-btn px-2 py-1 rounded-md bg-white border border-black/[0.08] text-[11px] font-semibold text-[#1D1D1F] flex items-center gap-1">
                                        <i data-lucide="plus" class="w-3 h-3"></i> 세부 추가
                                    </button>
                                </div>
                            </div>
                            ${subItems.length > 0 ? `<div class="space-y-1.5 border-l-2 border-[#D1D1D6] ml-1">${subItemsHtml}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function updateItem(idx, key, val) {
            if (key === 'qty' || key === 'price' || key === 'originalPrice') {
                state.items[idx][key] = val === '' ? 0 : Number(val);
            } else {
                state.items[idx][key] = val;
            }
            renderPreview();
        }
        function addCategoryHeader() {
            state.items.push({
                type: "category",
                categoryCode: "0" + (state.items.filter(i => i.type === 'category').length + 1),
                title: "NEW CATEGORY (새 대분류)"
            });
            renderItemsEditor();
            renderPreview();
        }
        function addQuoteItem() {
            state.items.push({
                type: "item",
                graphic: "editorial",
                customImage: "",
                title: "신규 디자인 제작 항목",
                code: "과업 범위 및 산출물 상세 설명",
                qty: 1,
                originalPrice: 0,
                price: 1500000,
                subItems: [
                    { title: "세부 시안 디자인 A", qty: "1식", price: 800000 },
                    { title: "세부 시안 디자인 B", qty: "1식", price: 700000 }
                ]
            });
            renderItemsEditor();
            renderPreview();
        }
        function removeQuoteItem(idx) {
            state.items.splice(idx, 1);
            renderItemsEditor();
            renderPreview();
        }
        function moveItem(idx, dir) {
            const target = idx + dir;
            if (target < 0 || target >= state.items.length) return;
            const temp = state.items[idx];
            state.items[idx] = state.items[target];
            state.items[target] = temp;
            renderItemsEditor();
            renderPreview();
        }
        function addSubItem(itemIdx) {
            if (!state.items[itemIdx].subItems) state.items[itemIdx].subItems = [];
            state.items[itemIdx].subItems.push({ title: "세부 작업 항목", qty: "1식", price: 0 });
            renderItemsEditor();
            renderPreview();
        }
        function updateSubItem(itemIdx, subIdx, key, val) {
            if (key === 'price') {
                state.items[itemIdx].subItems[subIdx][key] = val === '' ? 0 : Number(val);
            } else {
                state.items[itemIdx].subItems[subIdx][key] = val;
            }
            renderPreview();
        }
        function removeSubItem(itemIdx, subIdx) {
            state.items[itemIdx].subItems.splice(subIdx, 1);
            renderItemsEditor();
            renderPreview();
        }
        function sumSubItemsToParent(itemIdx) {
            const subs = state.items[itemIdx].subItems || [];
            const sum = subs.reduce((acc, cur) => acc + (Number(cur.price) || 0), 0);
            if (sum > 0) {
                state.items[itemIdx].price = sum;
                renderItemsEditor();
                renderPreview();
                showToast('세부 단가 합계가 상위 단가에 반영되었습니다.');
            }
        }
        function uploadItemImage(idx, inputEl) {
            const file = inputEl.files && inputEl.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                state.items[idx].customImage = e.target.result;
                renderItemsEditor();
                renderPreview();
            };
            reader.readAsDataURL(file);
        }
        function clearItemImage(idx) {
            state.items[idx].customImage = "";
            renderItemsEditor();
            renderPreview();
        }

        // 3. 합계 요약 에디터 (퍼센트 및 금액 자동계산 지원)
        function renderSummaryEditor() {
            const container = document.getElementById('extra-summary-container');
            container.innerHTML = state.extraSummary.map((row, idx) => `
                <div class="grid grid-cols-12 items-center gap-2">
                    <div class="col-span-7">
                        <input type="text" value="${escapeHtml(row.label)}" oninput="updateSummaryRow(${idx}, 'label', this.value)" class="apple-input !py-1.5 !px-2.5 text-[12.5px]" placeholder="항목명 (예: 부가세)">
                    </div>
                    <div class="col-span-4">
                        <input type="text" value="${escapeHtml(row.value)}" oninput="updateSummaryRow(${idx}, 'value', this.value)" class="apple-input !py-1.5 !px-2.5 text-right font-mono font-semibold text-[12.5px]" placeholder="금액 또는 10%">
                    </div>
                    <div class="col-span-1 flex justify-end">
                        <button type="button" onclick="removeSummaryRow(${idx})" class="p-1 text-[#86868B] hover:text-red-500">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }
        function updateSummaryRow(idx, key, val) {
            state.extraSummary[idx][key] = val;
            renderPreview();
        }
        function addSummaryRow() {
            state.extraSummary.push({ label: "부가세", value: "10%" });
            renderSummaryEditor();
            renderPreview();
        }
        function removeSummaryRow(idx) {
            state.extraSummary.splice(idx, 1);
            renderSummaryEditor();
            renderPreview();
        }

        // State -> 입력 폼 동기화
        function syncInputsFromState() {
            document.getElementById('inp-greeting').value = state.greeting;
            document.getElementById('inp-subtitle').value = state.subtitle;
            document.getElementById('inp-company').value = state.company;
            document.getElementById('inp-currency').value = state.currency;

            document.getElementById('inp-color-paper').value = state.paperTone || '#f6f6f4';
            document.getElementById('txt-color-paper').textContent = state.paperTone || '#f6f6f4';
            document.getElementById('inp-color-text').value = state.textColor || '#141414';
            document.getElementById('txt-color-text').textContent = state.textColor || '#141414';
            document.getElementById('inp-color-accent').value = state.accentColor || '#181818';
            document.getElementById('txt-color-accent').textContent = state.accentColor || '#181818';
            document.getElementById('inp-color-border').value = state.borderColor || '#181818';
            document.getElementById('txt-color-border').textContent = state.borderColor || '#181818';

            document.getElementById('inp-bill-title').value = state.billTitle;
            document.getElementById('inp-bill-lines').value = state.billLines;
            document.getElementById('inp-ship-title').value = state.shipTitle;
            document.getElementById('inp-ship-lines').value = state.shipLines;
            document.getElementById('inp-notes-title').value = state.notesTitle;
            document.getElementById('inp-notes-content').value = state.notesContent;
            document.getElementById('inp-footer-ThankYou').value = state.footerThankYou;
            document.getElementById('inp-footer-address').value = state.footerAddress;

            renderMetaEditor();

        // SVG 고정 좌표 헤드라인 + 서브타이틀 통합 블록
        function buildHeroHeaderSvgHtml(greetingText, subtitleText, txtCol) {
            const gText = (greetingText || 'hello.').trim();
            const sText = (subtitleText || '').trim().toUpperCase();
            const len = gText.length;

            let gSize = 80;
            let gY = 66;
            let sY = 92;
            let totalH = 100;

            if (len <= 6) {
                gSize = 80; gY = 66; sY = 92; totalH = 100;
            } else if (len <= 10) {
                gSize = 58; gY = 50; sY = 74; totalH = 82;
            } else if (len <= 16) {
                gSize = 42; gY = 38; sY = 60; totalH = 68;
            } else {
                gSize = 30; gY = 28; sY = 48; totalH = 56;
            }

            return `
                <svg width="360" height="${totalH}" viewBox="0 0 360 ${totalH}" style="display:block; overflow:visible;">
                    <text x="0" y="${gY}" fill="${txtCol}" font-family="'Pretendard', 'Inter', sans-serif" font-weight="900" font-size="${gSize}px" letter-spacing="-0.055em">${escapeHtml(gText)}</text>
                    <text x="2" y="${sY}" fill="${txtCol}" font-family="'Pretendard', 'Inter', sans-serif" font-weight="800" font-size="12px" letter-spacing="0.04em">${escapeHtml(sText)}</text>
                </svg>
            `;
        }

        // SVG 고정 좌표 정가 취소선
        function buildStrikePriceSvgHtml(priceStr, txtCol) {
            const w = Math.max(64, priceStr.length * 6.8);
            const lineStart = Math.max(0, w - (priceStr.length * 6.1));
            return `
                <svg width="${w}" height="15" viewBox="0 0 ${w} 15" style="display:block; margin-left:auto; overflow:visible;">
                    <text x="${w}" y="11" text-anchor="end" fill="${txtCol}" fill-opacity="0.45" font-family="'Pretendard', 'Inter', sans-serif" font-size="9.5px" font-weight="500">${escapeHtml(priceStr)}</text>
                    <line x1="${lineStart}" y1="7.5" x2="${w}" y2="7.5" stroke="${txtCol}" stroke-opacity="0.65" stroke-width="1.2"/>
                </svg>
            `;
        }

        // 품목 행 HTML 빌더
        function buildItemRowHtml(item, txtCol, accCol) {
            if (item.type === 'category') {
                const badgeSvg = item.categoryCode ? `
                    <svg width="24" height="17" viewBox="0 0 24 17" style="display:block; flex-shrink:0; margin-right:8px;">
                        <rect x="0" y="0" width="24" height="17" rx="3.5" fill="${accCol}" fill-opacity="0.1"/>
                        <text x="12" y="11.8" text-anchor="middle" fill="${accCol}" font-family="'Pretendard', 'Inter', sans-serif" font-size="9.5px" font-weight="900">${escapeHtml(item.categoryCode)}</text>
                    </svg>
                ` : '';
                return `
                    <div style="padding-top:14px; padding-bottom:8px; display:flex; align-items:center; border-top:1px solid rgba(0,0,0,0.14); color:${accCol};">
                        ${badgeSvg}
                        <span class="organic-text" style="font-size:10.5px; font-weight:900; text-transform:uppercase; letter-spacing:0.04em; line-height:1.35;">${escapeHtml(item.title)}</span>
                    </div>
                `;
            }

            const lineTotal = (Number(item.qty) || 0) * (Number(item.price) || 0);
            let thumbHtml = '';
            if (item.customImage) {
                thumbHtml = `<img src="${item.customImage}" style="width:44px; height:34px; object-fit:contain; margin-right:12px; flex-shrink:0; margin-top:2px;" alt="item">`;
            } else if (item.graphic && item.graphic !== 'none' && GRAPHIC_THUMBNAILS[item.graphic]) {
                thumbHtml = `<div style="margin-right:12px; flex-shrink:0; margin-top:2px; color:${accCol};">${GRAPHIC_THUMBNAILS[item.graphic].svg}</div>`;
            }

            const hasDiscount = item.originalPrice && Number(item.originalPrice) > Number(item.price);
            const subItems = item.subItems || [];

            const subItemsPreviewHtml = subItems.length > 0 ? `
                <div style="margin-top:8px; padding-top:7px; border-top:1px solid rgba(0,0,0,0.08);">
                    ${subItems.map(sub => `
                        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px; font-size:10px; line-height:1.45; margin-bottom:3px; color:${txtCol}; opacity:0.85;">
                            <div style="display:flex; align-items:flex-start; gap:5px; min-width:0; flex:1;">
                                <span style="opacity:0.55; flex-shrink:0;">└</span>
                                <div class="organic-text">
                                    <span style="font-weight:500;">${escapeHtml(sub.title)}</span>
                                    ${sub.qty ? `<span style="font-size:9.5px; opacity:0.65; margin-left:4px; white-space:nowrap;">(${escapeHtml(sub.qty)})</span>` : ''}
                                </div>
                            </div>
                            ${Number(sub.price) > 0 ? `<span class="organic-num" style="font-family:'Pretendard',monospace; font-size:9.5px; opacity:0.8; flex-shrink:0;">${formatMoney(sub.price)}</span>` : ''}
                        </div>
                    `).join('')}
                </div>
            ` : '';

            return `
                <div style="padding:14px 0; display:flex; align-items:flex-start; font-size:11px; color:${txtCol};">
                    <div style="width:52%; padding-right:12px; display:flex; align-items:flex-start; min-width:0;">
                        ${thumbHtml}
                        <div style="flex:1; min-width:0;">
                            <div class="organic-text" style="font-weight:800; font-size:12px; line-height:1.35; color:${txtCol};">${escapeHtml(item.title)}</div>
                            ${item.code ? `<div class="organic-text" style="font-size:10px; opacity:0.72; margin-top:2px; line-height:1.42;">${escapeHtml(item.code)}</div>` : ''}
                            ${subItemsPreviewHtml}
                        </div>
                    </div>
                    <div class="organic-num" style="width:10%; text-align:center; font-weight:600; padding-top:2px;">
                        &times; ${item.qty}
                    </div>
                    <div class="organic-num" style="width:18%; text-align:right; padding-top:2px; line-height:1.35;">
                        ${hasDiscount ? `<div style="margin-bottom:2px;">${buildStrikePriceSvgHtml(formatMoney(item.originalPrice), txtCol)}</div>` : ''}
                        <div style="font-weight:600;">${formatMoney(item.price)}</div>
                    </div>
                    <div class="organic-num" style="width:20%; text-align:right; font-weight:800; padding-top:2px;">
                        ${formatMoney(lineTotal)}
                    </div>
                </div>
            `;
        }

        function estimateItemHeight(item) {
            if (item.type === 'category') return 38;
            const subs = item.subItems || [];
            const subH = subs.length > 0 ? (16 + subs.length * 20) : 0;
            return 56 + subH;
        }

        // A4 다중 페이지 렌더링
        function renderPreview() {
            const pagesHost = document.getElementById('pages-host');
            if (!pagesHost) return;

            const paperBg = state.paperTone || '#f6f6f4';
            const txtCol = state.textColor || '#141414';
            const accCol = state.accentColor || '#181818';
            const bdrCol = state.borderColor || '#181818';

            let subtotal = 0;
            state.items.forEach(item => {
                if (item.type !== 'category') {
                    subtotal += (Number(item.qty) || 0) * (Number(item.price) || 0);
                }
            });

            const SINGLE_PAGE_ITEMS_LIMIT = 410;
            const FIRST_PAGE_ITEMS_LIMIT = 560;
            const MIDDLE_PAGE_ITEMS_LIMIT = 720;
            const LAST_PAGE_ITEMS_LIMIT = 500;

            const totalItemsH = state.items.reduce((acc, it) => acc + estimateItemHeight(it), 0);
            let pages = [];

            if (totalItemsH <= SINGLE_PAGE_ITEMS_LIMIT || state.items.length === 0) {
                pages.push({ items: state.items, isFirst: true, isLast: true });
            } else {
                let curItems = [];
                let curH = 0;
                let isFirst = true;

                state.items.forEach(it => {
                    const h = estimateItemHeight(it);
                    const maxH = isFirst ? FIRST_PAGE_ITEMS_LIMIT : MIDDLE_PAGE_ITEMS_LIMIT;
                    if (curItems.length > 0 && (curH + h) > maxH) {
                        pages.push({ items: curItems, isFirst: isFirst, isLast: false });
                        curItems = [it];
                        curH = h;
                        isFirst = false;
                    } else {
                        curItems.push(it);
                        curH += h;
                    }
                });

                if (curItems.length > 0) {
                    const lastLimit = isFirst ? SINGLE_PAGE_ITEMS_LIMIT : LAST_PAGE_ITEMS_LIMIT;
                    if (curH > lastLimit) {
                        pages.push({ items: curItems, isFirst: isFirst, isLast: false });
                        pages.push({ items: [], isFirst: false, isLast: true });
                    } else {
                        pages.push({ items: curItems, isFirst: isFirst, isLast: true });
                    }
                }
            }

            const totalPages = pages.length;
            const badgeEl = document.getElementById('page-count-badge');
            if (badgeEl) {
                badgeEl.textContent = `A4 · ${totalPages} ${totalPages > 1 ? 'Pages' : 'Page'}`;
            }

            const metaHtml = state.meta.map(m => `
                <div class="organic-text" style="line-height:1.55; font-size:11px;">
                    <span style="font-weight:800; text-transform:uppercase; margin-right:6px; color:${accCol};">${escapeHtml(m.label)}</span>
                    <span style="font-weight:400; color:${txtCol};">${escapeHtml(m.value)}</span>
                </div>
            `).join('');

            let grandTotal = subtotal;
            let summaryRowsHtml = `
                <div style="padding:6px 0; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,0,0,0.12); color:${txtCol};">
                    <span style="font-weight:500;">Subtotal</span>
                    <span class="organic-num" style="font-weight:600;">${formatMoney(subtotal)}</span>
                </div>
            `;
            state.extraSummary.forEach(row => {
                const computedAmt = calculateSummaryAmount(row.value, subtotal);
                grandTotal += computedAmt;
                summaryRowsHtml += `
                    <div style="padding:6px 0; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,0,0,0.12); color:${txtCol};">
                        <span class="organic-text" style="font-weight:500;">${escapeHtml(row.label)}</span>
                        <span class="organic-num" style="font-weight:600;">${formatMoney(computedAmt)}</span>
                    </div>
                `;
            });
            summaryRowsHtml += `
                <div style="padding-top:10px; padding-bottom:2px; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:${txtCol};">
                    <span style="font-weight:800;">Total</span>
                    <span class="organic-num" style="font-weight:900; font-size:14px; color:${accCol};">${formatMoney(grandTotal)}</span>
                </div>
            `;

            const tyLen = (state.footerThankYou || '').length;
            const tyFontSize = tyLen > 32 ? '14px' : (tyLen > 22 ? '16px' : '18px');

            pagesHost.innerHTML = pages.map((page, pageIdx) => {
                const pageNum = pageIdx + 1;

                const headerSection = page.isFirst ? `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:32px;">
                        <div class="preview-clickable" onclick="focusInput('inp-greeting')" style="flex:1; min-width:0;">
                            ${buildHeroHeaderSvgHtml(state.greeting, state.subtitle, txtCol)}
                        </div>
                        <div class="preview-clickable" onclick="focusInput('inp-company')" style="width:250px; flex-shrink:0; padding-top:4px; color:${txtCol};">
                            <div class="organic-text" style="font-weight:800; font-size:13.5px; margin-bottom:6px; line-height:1.35;">${escapeHtml(state.company)}</div>
                            <div>${metaHtml}</div>
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:36px; margin-bottom:26px; font-size:11.5px; line-height:1.62;">
                        <div class="preview-clickable" onclick="focusInput('inp-bill-lines')" style="min-width:0;">
                            <div class="organic-text" style="font-weight:800; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px; color:${accCol};">${escapeHtml(state.billTitle)}</div>
                            <div class="organic-text" style="white-space:pre-wrap; color:${txtCol};">${escapeHtml(state.billLines)}</div>
                        </div>
                        <div class="preview-clickable" onclick="focusInput('inp-ship-lines')" style="min-width:0;">
                            <div class="organic-text" style="font-weight:800; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px; color:${accCol};">${escapeHtml(state.shipTitle)}</div>
                            <div class="organic-text" style="white-space:pre-wrap; color:${txtCol};">${escapeHtml(state.shipLines)}</div>
                        </div>
                    </div>
                ` : `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:14px; margin-bottom:18px; border-bottom:1px solid rgba(0,0,0,0.15); font-size:10.5px; color:${txtCol};">
                        <div style="font-weight:800;">${escapeHtml(state.company)} <span style="opacity:0.5; font-weight:400; margin-left:6px;">— CONTINUED</span></div>
                        <div style="font-family:monospace; font-weight:700; opacity:0.65;">PAGE ${pageNum} / ${totalPages}</div>
                    </div>
                `;

                const itemsTableSection = page.items.length > 0 ? `
                    <div style="border-top:2px solid ${bdrCol}; border-bottom:1px solid rgba(0,0,0,0.15); padding:9px 0; display:flex; align-items:center; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:${txtCol};">
                        <div style="width:52%; padding-right:12px;">ITEM DESCRIPTION</div>
                        <div style="width:10%; text-align:center;">QTY</div>
                        <div style="width:18%; text-align:right;">PRICE</div>
                        <div style="width:20%; text-align:right;">ITEM TOTAL</div>
                    </div>
                    <div class="divide-y divide-black/10" style="border-bottom:1px solid rgba(0,0,0,0.2);">
                        ${page.items.map(it => buildItemRowHtml(it, txtCol, accCol)).join('')}
                    </div>
                ` : '';

                const summarySection = page.isLast ? `
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:28px; padding-top:18px; padding-bottom:22px; border-bottom:2px solid ${bdrCol};">
                        <div class="preview-clickable" onclick="focusInput('inp-notes-content')" style="min-width:0; padding-right:8px;">
                            <div class="organic-text" style="font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; color:${accCol};">${escapeHtml(state.notesTitle)}</div>
                            <div class="organic-text" style="font-size:10.5px; line-height:1.6; white-space:pre-wrap; color:${txtCol};">${escapeHtml(state.notesContent)}</div>
                        </div>
                        <div style="font-size:11.5px; min-width:0;">
                            ${summaryRowsHtml}
                        </div>
                    </div>
                ` : `
                    <div style="padding-top:14px; display:flex; justify-content:space-between; align-items:center; font-size:10px; font-weight:600; opacity:0.55; color:${txtCol};">
                        <span>다음 페이지로 이어집니다 (Continued on next page...)</span>
                        <span style="font-family:monospace;">PAGE ${pageNum} / ${totalPages}</span>
                    </div>
                `;

                const footerSection = page.isLast ? `
                    <div class="preview-clickable" onclick="focusInput('inp-footer-address')" style="padding-top:16px;">
                        <div style="display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:16px; margin-bottom:14px;">
                            <div class="organic-text" style="text-align:right; font-size:10px; line-height:1.6; white-space:pre-wrap; padding-right:8px; color:${txtCol};">${escapeHtml(state.footerAddress)}</div>
                            <div class="organic-text" style="text-align:left; padding-left:8px; font-weight:900; line-height:1.18; text-transform:uppercase; white-space:pre-wrap; color:${txtCol}; font-size:${tyFontSize};">${escapeHtml(state.footerThankYou)}</div>
                        </div>
                        <div style="text-align:center;">
                            <div style="font-size:10.5px; font-weight:800; margin-bottom:7px; color:${txtCol};">${escapeHtml(state.website)}</div>
                            <div style="display:${state.showSocials ? 'flex' : 'none'}; align-items:center; justify-content:center; gap:8px;">
                                <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="${accCol}"/><path fill="${paperBg}" d="M13.4 17.5v-5h1.7l.25-2h-1.95V9.2c0-.58.16-.97 1-.97h1.05V6.45c-.18-.02-.8-.08-1.52-.08-1.5 0-2.53.92-2.53 2.6v1.53H9.7v2h1.7v5h2z"/></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="${accCol}"/><path fill="${paperBg}" d="M17.3 8.8c-.4.17-.82.29-1.26.35.45-.27.8-.7.96-1.21-.42.25-.9.43-1.4.53a2.2 2.2 0 00-3.8 1.5c0 .17.02.34.05.5-1.83-.09-3.45-.97-4.54-2.3-.19.33-.3.7-.3 1.11 0 .76.39 1.44.98 1.83-.36-.01-.7-.11-1-.27v.03c0 1.07.76 1.96 1.77 2.16-.18.05-.38.08-.58.08-.14 0-.28-.01-.41-.04.28.88 1.1 1.51 2.06 1.53a4.43 4.43 0 01-2.74.94c-.18 0-.35-.01-.53-.03.98.63 2.14 1 3.39 1 4.06 0 6.29-3.37 6.29-6.29 0-.1 0-.19-.01-.29.43-.31.8-.7 1.1-1.14z"/></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="${accCol}"/><path fill="${paperBg}" d="M8.2 7.5h4.1c1.6 0 2.6.8 2.6 2.1 0 .9-.5 1.5-1.2 1.8.9.2 1.5.9 1.5 2 0 1.5-1.1 2.4-2.8 2.4H8.2V7.5zm1.8 3.4h2c.7 0 1.1-.3 1.1-.9 0-.6-.4-.9-1.1-.9h-2v1.8zm0 3.4h2.2c.8 0 1.2-.4 1.2-1 0-.7-.5-1-1.2-1h-2.2v2z"/></svg>
                                <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="${accCol}"/><rect x="7" y="7" width="10" height="10" rx="2.8" fill="none" stroke="${paperBg}" stroke-width="1.5"/><circle cx="12" cy="12" r="2.2" fill="none" stroke="${paperBg}" stroke-width="1.5"/><circle cx="14.9" cy="9.1" r="0.8" fill="${paperBg}"/></svg>
                            </div>
                            ${totalPages > 1 ? `<div style="margin-top:6px; font-family:monospace; font-size:9px; opacity:0.45; color:${txtCol};">PAGE ${pageNum} / ${totalPages}</div>` : ''}
                        </div>
                    </div>
                ` : `<div></div>`;

                return `
                    <div class="invoice-page-sheet paper-canvas select-text" style="width:740px; height:1046px; padding:54px 56px; display:flex; flex-direction:column; justify-content:space-between; background-color:${paperBg};">
                        <div>
                            ${headerSection}
                            ${itemsTableSection}
                            ${summarySection}
                        </div>
                        ${footerSection}
                    </div>
                `;
            }).join('');

            applyZoom();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2600);
        }

        // 고해상도 A4 JPG & 다중페이지 PDF 내보내기 (웹폰트 스타일 임베딩 보장)
        async function exportDocument(format) {
            const pageSheets = Array.from(document.querySelectorAll('.invoice-page-sheet'));
            if (pageSheets.length === 0) return;

            let offscreenHost = null;
            try {
                showToast(format === 'pdf' ? 'A4 PDF 파일을 생성하고 있습니다...' : 'A4 JPG 이미지를 생성하고 있습니다...');

                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }

                offscreenHost = document.createElement('div');
                offscreenHost.style.position = 'fixed';
                offscreenHost.style.left = '-9999px';
                offscreenHost.style.top = '0';
                offscreenHost.style.width = '740px';
                offscreenHost.style.zIndex = '-9999';
                document.body.appendChild(offscreenHost);

                const canvases = [];
                for (let i = 0; i < pageSheets.length; i++) {
                    offscreenHost.innerHTML = '';
                    const clone = pageSheets[i].cloneNode(true);
                    clone.style.transform = 'none';
                    clone.style.boxShadow = 'none';
                    clone.style.margin = '0';
                    clone.style.width = '740px';
                    clone.style.height = '1046px';
                    clone.style.fontFamily = "'Pretendard', 'Inter', -apple-system, sans-serif";
                    offscreenHost.appendChild(clone);

                    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                    const canvas = await html2canvas(clone, {
                        scale: 3,
                        width: 740,
                        height: 1046,
                        windowWidth: 1200,
                        scrollX: 0,
                        scrollY: 0,
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: state.paperTone || '#f6f6f4',
                        logging: false
                    });
                    canvases.push(canvas);
                }

                document.body.removeChild(offscreenHost);
                offscreenHost = null;

                const cleanName = (state.company || 'Quote').replace(/[^a-zA-Z0-9가-힣_-]/g, '_');

                if (format === 'jpg') {
                    canvases.forEach((canvas, idx) => {
                        const link = document.createElement('a');
                        const suffix = canvases.length > 1 ? `_Page${idx + 1}` : '';
                        link.download = `${cleanName}_Quote${suffix}.jpg`;
                        link.href = canvas.toDataURL('image/jpeg', 0.98);
                        link.click();
                    });
                    showToast(`JPG 저장 완료 (${canvases.length}장)`);
                } else {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                    canvases.forEach((canvas, idx) => {
                        if (idx > 0) pdf.addPage('a4', 'portrait');
                        const imgData = canvas.toDataURL('image/jpeg', 0.98);
                        pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                    });
                    pdf.save(`${cleanName}_Quote.pdf`);
                    showToast(`PDF 저장 완료 (${canvases.length}페이지)`);
                }
            } catch (err) {
                console.error(err);
                if (offscreenHost && offscreenHost.parentNode) {
                    offscreenHost.parentNode.removeChild(offscreenHost);
                }
                showToast('저장 중 오류가 발생했습니다.');
            }
        }

        function bindInputEvents() {
            const bindings = [
                { id: 'inp-greeting', key: 'greeting' },
                { id: 'inp-subtitle', key: 'subtitle' },
                { id: 'inp-company', key: 'company' },
                { id: 'inp-currency', key: 'currency' },
                { id: 'inp-bill-title', key: 'billTitle' },
                { id: 'inp-bill-lines', key: 'billLines' },
                { id: 'inp-ship-title', key: 'shipTitle' },
                { id: 'inp-ship-lines', key: 'shipLines' },
                { id: 'inp-notes-title', key: 'notesTitle' },
                { id: 'inp-notes-content', key: 'notesContent' },
                { id: 'inp-footer-ThankYou', key: 'footerThankYou' },
                { id: 'inp-footer-address', key: 'footerAddress' },
                { id: 'inp-website', key: 'website' }
            ];

            bindings.forEach(({ id, key }) => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', (e) => {
                        state[key] = e.target.value;
                        renderPreview();
                    });
                }
            });

            const colorBindings = [
                { id: 'inp-color-paper', key: 'paperTone', txtId: 'txt-color-paper' },
                { id: 'inp-color-text', key: 'textColor', txtId: 'txt-color-text' },
                { id: 'inp-color-accent', key: 'accentColor', txtId: 'txt-color-accent' },
                { id: 'inp-color-border', key: 'borderColor', txtId: 'txt-color-border' }
            ];

            colorBindings.forEach(({ id, key, txtId }) => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', (e) => {
                        state[key] = e.target.value;
                        document.getElementById(txtId).textContent = e.target.value;
                        renderPreview();
                    });
                }
            });

            document.getElementById('inp-show-socials').addEventListener('change', (e) => {
                state.showSocials = e.target.checked;
                renderPreview();
            });
        }

        window.onload = function() {
            lucide.createIcons();
            bindInputEvents();
            syncInputsFromState();
            renderPreview();
            if (window.innerWidth < 768) {
                setViewMode('edit');
            } else {
                setViewMode('split');
            }
        };

        window.addEventListener('resize', () => {
            fitPaperToScreen();
        });
    </script>
</body>
</html>
